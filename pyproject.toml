[project]
name = "nv-dice"
version = "0.0.1"
description = "Backend for nv dice game"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.129.2",
    "sqlalchemy>=2.0.46",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "polyfactory>=3.2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.2",
]
