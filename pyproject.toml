[project]
name = "nv-dice"
version = "0.0.1"
description = "Backend for nv dice game"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = "==3.11.*"
dependencies = [
    "alembic>=1.18.4",
    "alembic-postgresql-enum>=1.10.0",
    "asyncpg>=0.31.0",
    "babel>=2.18.0",
    "bcrypt>=5.0.0",
    "dishka>=1.8.0",
    "fastapi[standard]>=0.135.1",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.3",
    "pyjwt>=2.11.0",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.48",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "polyfactory>=3.2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.2",
]
