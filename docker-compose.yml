services:
  postgres:
    container_name: nv-dice-postgres
    image: postgres:15-alpine
    expose:
      - "${DB_PORT}"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGPORT: ${DB_PORT}
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: nv-dice-redis
    image: redis:7-alpine
    expose:
      - "${REDIS_PORT}"
    command: >-
      sh -c 'if [ -n "$$REDIS_USER" ]; then set -- --user default off --user "$$REDIS_USER" on "~*" "+@all" ">$$REDISCLI_AUTH"; elif [ -n "$$REDISCLI_AUTH" ]; then set -- --requirepass "$$REDISCLI_AUTH"; fi; exec redis-server --port "${REDIS_PORT}" "$$@"'
    environment:
      REDIS_USER: ${REDIS_USER}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      start_period: 3s
      interval: 10s
      timeout: 5s
      retries: 3