version: 1
disable_existing_loggers: False
formatters:
  default:
    "()": src.core.logger.LoggingFormatter
    format: '[%(asctime)s] [%(process)d] [%(levelname)s] [%(name)s]: %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
    use_colors: true
  access:
    "()": src.core.logger.AccessLoggingFormatter
    format: '[%(asctime)s] [%(process)d] [%(levelname)s] [%(name)s]: %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
    use_colors: true
handlers:
  default:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stderr
  access:
    formatter: access
    class: logging.StreamHandler
    stream: ext://sys.stdout
loggers:
  uvicorn.error:
    level: INFO
    handlers:
      - default
    propagate: no
  uvicorn.access:
    level: INFO
    handlers:
      - access
    propagate: no
  gunicorn.error:
    level: INFO
    handlers:
      - default
    propagate: no
  gunicorn.access:
    level: INFO
    handlers:
      - access
    propagate: no
root:
  level: INFO
  handlers:
    - default
  propagate: no